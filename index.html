    let selLock = false;

    function getSelectedText() {
      const sel = window.getSelection();
      return sel && sel.toString().trim() ? sel.toString() : '';
    }
    function positionSelTools() {
      const sel = window.getSelection();
      if (!sel || sel.rangeCount === 0) return false;
      const range = sel.getRangeAt(0);
      const rect = range.getBoundingClientRect();
      if (!rect || (rect.width === 0 && rect.height === 0)) return false;
      const x = rect.left + rect.width / 2 + window.scrollX;
      const y = rect.top + window.scrollY;
      selTools.style.left = x + 'px';
      selTools.style.top = (y - 12) + 'px';
      selTools.style.transform = 'translate(-50%, -100%)';
      return true;
    }
    function showSelTools() {
      if (getSelectedText()) {
        if (positionSelTools()) {
          selTools.style.display = 'flex';
        }
      }
    }
    function hideSelTools() { if (!selLock) selTools.style.display = 'none'; }

    selTools.addEventListener('mousedown', () => { selLock = true; });
    selTools.addEventListener('mouseup', () => { setTimeout(() => { selLock = false; hideSelTools(); }, 120); });

    // منع قائمة المتصفح/السياق قدر الإمكان أثناء التحديد والضغط على نصوص المحتوى

    }, { passive: false });

    window.addEventListener('scroll', () => { if (selTools.style.display !== 'none') { if (!positionSelTools()) hideSelTools(); } });

    function updatePartCounts() {

        BOOKS_LIST.forEach(b => { counts[b.id] = 0; });

        // fallback للأجزاء من 1 إلى 5
        for (let i = 1; i <= 5; i++) { counts[i] = 0; }
      }
      (DATA || []).forEach(it => {
        const p = String(it.part);
        if (counts[p] != null) { counts[p]++; }
      });
      // تحديث تسميات العناصر في القائمة

      const allCount = Object.values(counts).reduce((a, b) => a + b, 0);

      // تحديث كل جزء
      Object.keys(counts).forEach(id => {
        const label = document.querySelector(`.pRow[data-val="${id}"] .pLabel`);

    /**

     * تُستدعى هذه الدالة بعد تحميل البيانات لتحديث القائمة.

    function populatePartsPicker() {
      const pickerList = document.getElementById('pickerList');
      if (!pickerList) return;

      pickerList.innerHTML += `

      // أضف الأجزاء من BOOKS_LIST أو استخدم الأجزاء الافتراضية 1-5
      // استخدم ترتيب الكتب كما هو موجود في BOOKS_LIST إن وُجد، ولا تقم بفرزها. في حال عدم وجود قائمة كتب

    function renderMasailPartsGrid() {

        for (let i = 1; i <= 5; i++) { counts[String(i)] = 0; }
      }
      (DATA || []).forEach(it => {
        const p = String(it.part);
        if (counts[p] != null) { counts[p]++; }
      });

      const allCount = Object.values(counts).reduce((a, b) => a + b, 0);

        ? BOOKS_LIST.map(b => ({ id: String(b.id), name: b.name }))
        : [{ id: '1', name: partWord(1) }, { id: '2', name: partWord(2) }, { id: '3', name: partWord(3) }, { id: '4', name: partWord(4) }, { id: '5', name: partWord(5) }];
      
      if (!usingBooksList) {
        parts.sort((a, b) => Number(a.id) - Number(b.id));
      }

      parts.forEach(p => {

     * يعين الجزء الحالي ويظهر قائمة المسائل ويخفي شبكة البطاقات.

    function openMasailPart(partId) {
      CUR_PART = partId || '';
      SETTINGS.filterPart = CUR_PART; saveSettings(SETTINGS);
      
      // إظهار شريط الأدوات وإخفاء الهيدر الرئيسي عند الدخول للكتاب

      populatePartsPicker();
      updatePartCounts();
      // إظهار/إخفاء أقسام الصفحة
      const partsView = document.getElementById('partsViewMasail');
      const listView = document.getElementById('listView');
      const searchDock = document.getElementById('searchDock');
      if (partsView) { partsView.style.display = 'none'; }
      if (listView) { 
        listView.style.display = ''; 
        listView.classList.add('anim-enter'); // تشغيل الانيميشن
      }
      if (searchDock) { searchDock.style.display = ''; }
      // show the search button when switching into list view so users can actually search
      const searchBtn = document.getElementById('searchBtn');
      if (searchBtn) {
        // use inline-flex to preserve the icon button layout; empty string falls back to stylesheet default
        searchBtn.style.display = 'inline-flex';
      }
      // إعادة التهيئة وعرض المسائل
      resetPagination();
      // تحديث عنوان الفهرست وفق الجزء الحالي
      updateTocCardTitle();
    }

    /**
     * الرجوع إلى شبكة بطاقات الأجزاء من قائمة المسائل.
     */
    function backToParts() {
      // إخفاء شريط الأدوات وإظهار الهيدر الرئيسي عند العودة للرئيسية
      $('#skybar').style.display = 'none';
      $('header').style.display = 'block';

      // إعادة إلغاء جميع الأوضاع الخاصة (المحفوظات/العناوين/الانتقال إلى رقم) والعودة للوضع العادي
      setSavedMode(false);
      setHeaderMode(false);
      setGoMode(null);
      // إعادة تعيين الجزء الحالي
      CUR_PART = '';
      SETTINGS.filterPart = '';
      saveSettings(SETTINGS);
      // إخفاء قائمة المسائل وشريط البحث وإظهار شبكة الكتب
      const partsView = document.getElementById('partsViewMasail');
      const listView = document.getElementById('listView');
      const searchDock = document.getElementById('searchDock');
      if (listView) { 
        listView.style.display = 'none'; 
        listView.classList.remove('anim-enter'); // إعادة تهيئة الانيميشن
      }
      if (searchDock) { searchDock.style.display = 'none'; }
      // hide the search button when returning to the cards grid; searching is not available in this view
      const searchBtn = document.getElementById('searchBtn');
      if (searchBtn) {
        searchBtn.style.display = 'none';
      }
      if (partsView) { partsView.style.display = ''; }
      // إعادة بناء شبكة البطاقات وتحديث العدادات
      populatePartsPicker();
      updatePartCounts();
      renderMasailPartsGrid();
      // إعادة تعيين حقول البحث والذهاب وعداد العناصر دون تصيير القائمة
      $('#search').value = '';
      $('#gotoNum').value = '';
      CURRENT_ITEMS = 0;
      TOTAL_ITEMS = 0;
      // تحديث عنوان الفهرست
      updateTocCardTitle();
    }

    function showToc() {
      const partVal = getCurrentPart();
      const titleEl = $('#tocModalTitle');
      const listEl = $('#tocList');
      const backBtn = $('#tocBackBtn');

      // التحكم في إظهار زر الرجوع
      if (TOC_MODE === 'headers' && TOC_FROM_PARTS_LIST) {
        backBtn.style.display = 'inline-flex';
      } else {
        backBtn.style.display = 'none';
      }

      if (TOC_MODE === 'parts') {
        // تحديث العنوان بناءً على الجزء المحدد حالياً (باستخدام partFullLabel لمنع تكرار كلمة "الجزء")
        if (partVal) {
          titleEl.textContent = `فهرست ${partFullLabel(partVal)}`;
        } else {
          titleEl.textContent = 'فهرست جميع الكتب';
        }

        // حساب أعداد المسائل لكل جزء ديناميكياً
        const counts = {};
        (DATA || []).forEach(it => {
          const p = Number(it.part);
          if (!isNaN(p)) counts[p] = (counts[p] || 0) + 1;
        });

        // إذا كان هناك جزء محدد، اعرض عناوينه مباشرة
        if (partVal) {
          TOC_FROM_PARTS_LIST = false; // دخلنا مباشرة من جزء محدد
          showHeadersForPart(partVal);
          return;
        }

        // إذا لم يكن هناك جزء محدد، اعرض قائمة جميع الكتب
        // إنشاء عناصر الفهرست ديناميكياً عند عدم تحديد جزء
        // استخدم ترتيب الكتب من BOOKS_LIST إذا كانت متاحة، وإلا قم بفرز الأجزاء المستخرجة من counts
        let partNumbers;
        if (Array.isArray(BOOKS_LIST) && BOOKS_LIST.length > 0) {
          partNumbers = BOOKS_LIST.map(b => Number(b.id)).filter(id => counts[id] != null);
        } else {
          partNumbers = Object.keys(counts).map(Number).sort((a, b) => a - b);
        }
        listEl.innerHTML = partNumbers.map(p => {
          // استخدم اسم كامل للجزء بدون تكرار كلمة "الجزء"
          const label = `فهرست ${partFullLabel(p)}`;
          const count = counts[p] || 0;
          return `<div class="tocItem" data-part="${p}"><span class="tocLabel">${label}</span><span class="tocCount">(${count})</span></div>`;
        }).join('');
        // ربط الأحداث لكل عنصر فهرست
        $$('.tocItem').forEach(item => {
          item.addEventListener('click', () => {
            const part = item.getAttribute('data-part');
            TOC_FROM_PARTS_LIST = true;
            showHeadersForPart(part);
          });
        });
      } else if (TOC_MODE === 'headers') {
        // عرض عناوين الجزء المحدد
        const partName = TOC_CURRENT_PART ? partFullLabel(TOC_CURRENT_PART) : 'جميع الكتب';
        titleEl.textContent = `فهرست ${partName}`;

        let headersToShow = HEADERS;
        if (TOC_CURRENT_PART) {
          headersToShow = HEADERS.filter(h => Number(h.part) === Number(TOC_CURRENT_PART));
        }

        const questionCountByHeader = {};
        const pool = DATA;
        pool.forEach(q => {
          const hid = q.headerId;
          if (hid) questionCountByHeader[hid] = (questionCountByHeader[hid] || 0) + 1;
        });

        if (headersToShow.length === 0) {
          listEl.innerHTML = `<div style="text-align:center;color:var(--muted);padding:16px;">لا توجد فواصل.</div>`;
        } else {
          listEl.innerHTML = headersToShow.map(h => {
            const count = questionCountByHeader[h.id] || 0;
            return `
              <div class="tocItem" data-hid="${h.id}">
                <span class="tocLabel">${escapeHtml(h.title)}</span>
                <span class="tocCount">(${count})</span>
              </div>
            `;
          }).join('');

          $$('.tocItem').forEach(item => {
            item.addEventListener('click', () => {
              const hid = item.getAttribute('data-hid');
              // أغلق نافذة الفهرست
              closeToc();
              // إذا كان المستخدم لا يزال في صفحة البطاقات (أقسام الكتب)، قم بفتح قائمة المسائل للجزء الحالي
              const partsView = document.getElementById('partsViewMasail');
              const listView = document.getElementById('listView');
              if (partsView && (!listView || listView.style.display === 'none')) {
                // استخدم الجزء المُختار من الفهرست، أو فراغ لعرض جميع الكتب
                const partToOpen = TOC_CURRENT_PART || '';
                openMasailPart(partToOpen);
              }
              // فعل وضع العنوان للعنوان المحدد
              setHeaderMode(true, hid);
              window.scrollTo({ top: 0, behavior: 'smooth' });
            });
          });
        }
      }

      const overlay = $('#tocOverlay');
      overlay.classList.add('show');
      overlay.setAttribute('aria-hidden', 'false');
      document.body.classList.add('modal-open');
    }

    function showHeadersForPart(part) {
      TOC_MODE = 'headers';
      TOC_CURRENT_PART = part;
      showToc();
    }

    function closeToc() {
      const overlay = $('#tocOverlay');
      overlay.classList.remove('show');
      overlay.setAttribute('aria-hidden', 'true');
      document.body.classList.remove('modal-open');
      // إعادة تعيين وضع الفهرست إلى الأجزاء عند الإغلاق
      TOC_MODE = 'parts';
      TOC_CURRENT_PART = null;
      TOC_FROM_PARTS_LIST = false;
    }

    $('#tocBtn').addEventListener('click', showToc);
    $('#tocClose').addEventListener('click', closeToc);
    $('#tocBackBtn').addEventListener('click', () => {
      TOC_MODE = 'parts';
      TOC_CURRENT_PART = null;
      TOC_FROM_PARTS_LIST = false;
      showToc();
    });
    $('#tocOverlay').addEventListener('click', (e) => { if (e.target === $('#tocOverlay')) closeToc(); });

    const AR_DIGITS = { '٠': '0', '١': '1', '٢': '2', '٣': '3', '٤': '4', '٥': '5', '٦': '6', '٧': '7', '٨': '8', '٩': '9' };
    function normalizeDigits(s) {
      return String(s || '').replace(/[٠-٩]/g, d => AR_DIGITS[d] ?? d).replace(/[^\d]/g, '');
    }
    function wireGoto() {
      const input = $('#gotoNum');
      if (!input) return;
      input.addEventListener('input', () => {
        clearTimeout(GO_TIMER);
        GO_TIMER = setTimeout(() => {
          const numStr = normalizeDigits(input.value).slice(0, 4);
          input.value = numStr.replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
          if (numStr === '') { setGoMode(null); return; }
          const n = parseInt(numStr, 10);
          if (isNaN(n) || n <= 0) { setGoMode(null); return; }
          setGoMode(n);
        }, 250);
      });
    }

    // ربط زر تحميل المزيد
    $('#loadMore').addEventListener('click', loadMoreItems);

    // ربط الأحداث لإعادة التعيين
    $('#search').oninput = () => { resetPagination(); };
    $('#gotoNum').oninput = () => { resetPagination(); };

    (async function init() {
      setTheme(SETTINGS.theme);
      applyInk(SETTINGS.ink);
      applyZoom(SETTINGS.zoom);

      CUR_PART = SETTINGS.filterPart || '';

      // دالة موحدة لتبديل المظهر وتحديث جميع الأيقونات
      function toggleThemeApp() {
        const cur = document.documentElement.getAttribute('data-theme');
        const newTheme = cur === 'dark' ? 'light' : 'dark';
        setTheme(newTheme);
        toast(`الوضع ${newTheme === 'dark' ? 'الداكن' : 'الفاتح'}`);
      }

      // ربط الزر الموجود في شريط الأدوات (Skybar)
      const themeBtnSky = $('#theme');
      if (themeBtnSky) themeBtnSky.onclick = toggleThemeApp;

      // ربط الزر الجديد الموجود في الهيدر
      const headerThemeBtn = $('#headerThemeBtn');
      if (headerThemeBtn) headerThemeBtn.onclick = toggleThemeApp;

      setupSkybar();
      wireSavedToggle();
      updateSavedBadge();

      // ===== تحديث تحميل البيانات لدعم نظام الملفات المنفصلة =====
      const [qData, hData, tData] = await Promise.all([loadAllQuestions(), loadHeaders(), loadTexts()]);
      DATA = Array.isArray(qData) ? qData : []; HEADERS = Array.isArray(hData) ? hData : []; TEXTS = Array.isArray(tData) ? tData : [];


      // بناء قائمة منتقي الأجزاء وتحديث العدادات
      populatePartsPicker();
      updatePartCounts();
      // بدلاً من تصيير المسائل مباشرة، نعرض شبكة بطاقات الأجزاء ليتخيّر المستخدم الجزء المطلوب
      renderMasailPartsGrid();

      // منع قائمة الضغط المطوّل/الزر الأيمن على صور الأغلفة
      document.addEventListener('contextmenu', (e) => {
        if (e.target && e.target.closest && e.target.closest('.part-cover, .listTitleCover')) e.preventDefault();
      }, { passive: false });

      // تأكد من إظهار شبكة الأجزاء وإخفاء قائمة المسائل وشريط البحث
      const partsView = document.getElementById('partsViewMasail');
      const listView = document.getElementById('listView');
      const searchDock = document.getElementById('searchDock');
      if (partsView) { partsView.style.display = ''; }
      if (listView) { listView.style.display = 'none'; }
      if (searchDock) { searchDock.style.display = 'none'; }
      // ensure the search button is hidden on initial load since the cards view does not support searching
      const searchBtnInit = document.getElementById('searchBtn');
      if (searchBtnInit) { searchBtnInit.style.display = 'none'; }
      // ربط الحقول الخاصة بالانتقال إلى رقم مسألة بعد اختيار جزء
      wireGoto();

      document.getElementById('yr').textContent = new Date().getFullYear();
      reapplyInkForTheme();

    })();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }

    window.addEventListener('resize', () => { clearTimeout(window.__rAF); window.__rAF = setTimeout(render, 120); });
  </script>

<script>
  /**
   * نظام التعريب الشامل للأرقام (ArNum System)
   * يقوم بتحويل الأرقام الإنجليزية إلى عربية في جميع النصوص الظاهرة
   * ويتجاهل الأكواد البرمجية والسمات (Attributes) لضمان عدم تعطل التطبيق.
   */
  (function() {
    // 1. خريطة التحويل
    const AR_DIGITS = {'0':'٠','1':'١','2':'٢','3':'٣','4':'٤','5':'٥','6':'٦','7':'٧','8':'٨','9':'٩'};
    
    // دالة التحويل النصي المباشر
    function toAr(str) {
      if (!str) return '';
      return str.replace(/\d/g, d => AR_DIGITS[d]);
    }

    // 2. دالة معالجة العقد النصية (تتأكد أننا نغير النص الظاهر فقط وليس الكود)
    function handleNode(node) {
      // تجاهل وسوم السكربت والستايل والمدخلات (لتجنب المشاكل التقنية)
      const ignoreTags = ['SCRIPT', 'STYLE', 'INPUT', 'TEXTAREA', 'CODE'];
      if (node.parentElement && ignoreTags.includes(node.parentElement.tagName)) return;

      // التحقق مما إذا كان النص يحتوي على أرقام إنجليزية
      if (node.nodeType === 3 && /\d/.test(node.nodeValue)) {
        node.nodeValue = toAr(node.nodeValue);
      }
    }

    // 3. دالة تفحص شجرة العناصر (DOM)
    function walk(node) {
      if (node.nodeType === 3) { // 3 تعني عقدة نصية
        handleNode(node);
      } else {
        // إذا كان عنصراً، ابحث في أبنائه
        node.childNodes.forEach(walk);
      }
    }

    // 4. المراقب القوي (MutationObserver)
    // وظيفته: مراقبة أي تغيير يحدث في الصفحة تلقائياً
    const observer = new MutationObserver(mutations => {
      mutations.forEach(mutation => {
        // حالة إضافة عناصر جديدة (مثل تحميل البيانات من JSON)
        mutation.addedNodes.forEach(node => {
          walk(node);
        });

        // حالة تغيير نص موجود بالفعل
        if (mutation.type === 'characterData') {
          handleNode(mutation.target);
        }
      });
    });

    // تشغيل المراقب على كامل الصفحة
    observer.observe(document.body, {
      childList: true,      // مراقبة إضافة/حذف العناصر
      subtree: true,        // مراقبة جميع الأبناء والأحفاد
      characterData: true   // مراقبة تغيير النصوص
    });

    // تشغيل أولي (لتحويل ما هو موجود بالفعل عند التحميل)
    walk(document.body);
    
    // تعديل عنوان الصفحة (Title) أيضاً
    document.title = toAr(document.title);

  })();
</script>
